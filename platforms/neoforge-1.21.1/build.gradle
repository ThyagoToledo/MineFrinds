dependencies {
    implementation 'com.thyagotoledo.companions:core:0.1.0-SNAPSHOT'
    compileOnly 'com.google.code.gson:gson:2.10.1'
    compileOnly mcLibs
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'com.google.guava:guava:32.1.2-jre'
    testImplementation mcLibs
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.named('jar', Jar).configure {
    from("${projectDir}/../../core/build/classes/java/main")
    from("${projectDir}/../../core/build/resources/main")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.register('tensuraJar', Jar) {
    from sourceSets.main.output
    from("${projectDir}/../../core/build/classes/java/main")
    from("${projectDir}/../../core/build/resources/main")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveBaseName = "${mod_id}-neoforge-1.21.1-tensura-neo-otherworld"
    archiveVersion = "${mod_version}"
    manifest {
        attributes([
                'Specification-Title'     : "${mod_id}-tensura-neo-otherworld",
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : "${project.name}-tensura-neo-otherworld",
                'Implementation-Version'  : archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'Modpack-Target'          : 'Tensura Neo Otherworld'
        ])
    }
}
