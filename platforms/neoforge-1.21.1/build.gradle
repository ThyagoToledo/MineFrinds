plugins {
    id 'java-library'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge-1.21.1"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    implementation 'com.thyagotoledo.companions:core:0.1.0-SNAPSHOT'
    compileOnly files(
        'C:/Users/thyag/curseforge/minecraft/Install/libraries/net/neoforged/fancymodloader/loader/4.0.44/loader-4.0.44.jar',
        'C:/Users/thyag/curseforge/minecraft/Install/libraries/net/neoforged/bus/8.0.5/bus-8.0.5.jar',
        'C:/Users/thyag/curseforge/minecraft/Install/libraries/net/neoforged/neoforge/21.1.251/neoforge-21.1.251-universal.jar',
        'C:/Users/thyag/curseforge/minecraft/Install/libraries/net/minecraft/client/1.21.1-20240808.144430/client-1.21.1-20240808.144430-srg.jar',
        'C:/Users/thyag/curseforge/minecraft/Install/libraries/com/mojang/brigadier/1.3.10/brigadier-1.3.10.jar',
        'C:/Users/thyag/curseforge/minecraft/Install/libraries/org/lwjgl/lwjgl/3.3.3/lwjgl-3.3.3.jar',
        'C:/Users/thyag/curseforge/minecraft/Install/libraries/org/lwjgl/lwjgl-glfw/3.3.3/lwjgl-glfw-3.3.3.jar'
    )
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.named('jar', Jar).configure {
    from("${projectDir}/../../core/build/classes/java/main")
    from("${projectDir}/../../core/build/resources/main")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.register('tensuraJar', Jar) {
    from sourceSets.main.output
    from("${projectDir}/../../core/build/classes/java/main")
    from("${projectDir}/../../core/build/resources/main")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveBaseName = "${mod_id}-neoforge-1.21.1-tensura-neo-otherworld"
    archiveVersion = "${mod_version}"
    manifest {
        attributes([
                'Specification-Title'     : "${mod_id}-tensura-neo-otherworld",
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : "${project.name}-tensura-neo-otherworld",
                'Implementation-Version'  : archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'Modpack-Target'          : 'Tensura Neo Otherworld'
        ])
    }
}
